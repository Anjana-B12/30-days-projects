<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Calculator</title>
    <link rel="stylesheet" href="/password-strength.css">
</head>
<body>
    <div class="container">
        <h1>Password Strength Checker</h1>
        <form>
            <label for="pass">
                Enter your password: 
            </label>
            <input type="password" id="pass" placeholder="Type your password" required>
            <input type="submit" value="Check" id="btn">
        </form>
        <div class="result">
            <p></p>
        </div>
    </div>
    <script src="/password-strength.js"></script>
</body>
</html>
